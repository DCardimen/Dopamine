dius:11px;font-weight:900;font-size:13px}button.on{background:#315a8d}button.next{background:#7c541b;border-color:#d19941}button:disabled{opacity:.35}#overlay{position:fixed;inset:66px 0 61px;display:none;align-items:center;justify-content:center;background:#03060ad8;padding:16px;z-index:8}#card{width:min(430px,94vw);max-height:90%;overflow:auto;background:#0e1826;border:1px solid #3b506f;border-radius:18px;padding:19px;box-shadow:0 25px 80px #000}.result{text-align:center;font-size:27px;font-weight:1000;margin:0 0 10px}.win{color:#ffd171}.loss{color:#ff7c86}pre{white-space:pre-wrap;background:#080e16;padding:12px;border-radius:11px;line-height:1.42;font-size:12px}.note{font-size:11px;opacity:.65;text-align:center;line-height:1.4}
