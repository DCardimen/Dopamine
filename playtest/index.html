<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dopamine — Goal 01 v2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b11;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 35%,#101b29 0,#080d14 58%,#05080d 100%)}
header{min-height:62px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;background:#0c1420ee;border-bottom:1px solid #29384f;z-index:3}.title{font-weight:900;letter-spacing:.04em;font-size:13px;line-height:1.15}.sub{font-size:11px;opacity:.65;margin-top:3px}.pill{white-space:nowrap;border:1px solid #354863;background:#152235;padding:8px 9px;border-radius:11px;font-weight:850;font-size:12px}#hp.low{border-color:#a53b43;background:#421923;color:#ffd8dc}
#stage{position:relative;flex:1;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#event{position:absolute;top:14%;left:50%;transform:translate(-50%,-50%) scale(.86);opacity:0;font-weight:1000;font-size:clamp(18px,5vw,34px);letter-spacing:.08em;text-shadow:0 3px 15px #000;pointer-events:none;transition:opacity .08s,transform .08s;z-index:2}#event.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#skills{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;pointer-events:none}.skill{position:relative;overflow:hidden;border:1px solid #384d69;background:#101b2aDD;border-radius:10px;padding:7px 8px;min-height:42px}.skill .name{font-size:10px;font-weight:900;letter-spacing:.04em}.skill .cd{font-size:11px;margin-top:2px;font-weight:800}.skill .fill{position:absolute;left:0;bottom:0;height:3px;background:#6ecbff;width:0}.skill.ready{border-color:#5aa4d4;box-shadow:0 0 13px #2f88c633 inset}.skill.slam.ready{border-color:#db9d3f;box-shadow:0 0 13px #d6812633 inset}.skill.slam .fill{background:#f2a93b}
footer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:#0c1420;border-top:1px solid #29384f;z-index:3}button{min-height:44px;border:1px solid #3c5170;background:#152235;color:#eef4ff;border-radius:11px;font-weight:900;font-size:13px}button.on{background:#315a8d;border-color:#6597cd}button.next{background:#7c541b;border-color:#d19941}button:disabled{opacity:.35}
#overlay{position:fixed;inset:62px 0 61px;display:none;align-items:center;justify-content:center;background:#03060acc;padding:16px;z-index:8}#card{width:min(430px,94vw);max-height:88%;overflow:auto;background:#0e1826;border:1px solid #3b506f;border-radius:18px;padding:19px;box-shadow:0 25px 90px #000}.result{text-align:center;font-size:28px;font-weight:1000;letter-spacing:.08em;margin:0 0 10px}.result.win{color:#ffd171}.result.loss{color:#ff7c86}pre{margin:8px 0 14px;white-space:pre-wrap;background:#080e16;padding:12px;border-radius:11px;line-height:1.42;font-size:12px;color:#dce8f7}.note{font-size:11px;opacity:.65;line-height:1.4;text-align:center}.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{font-size:10px;border:1px solid #31445e;border-radius:999px;padding:3px 7px;background:#101b2a}
</style>
</head>
<body>
<div id="app">
<header><div><div id="wave" class="title">DOPAMINE</div><div id="threat" class="sub">Goal 01 v2 — combat feel</div></div><div id="hp" class="pill">HP 500/500</div><div id="spd" class="pill">1×</div></header>
<div id="stage"><canvas id="c"></canvas><div id="event"></div><div id="skills"><div id="sSlash" class="skill"><div class="name">HEAVY SLASH</div><div class="cd">READY</div><div class="fill"></div></div><div id="sWhirl" class="skill"><div class="name">WHIRLWIND</div><div class="cd">READY</div><div class="fill"></div></div><div id="sSlam" class="skill slam"><div class="name">GROUND SLAM</div><div class="cd">READY</div><div class="fill"></div></div></div></div>
<footer><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button><button id="next" class="next" disabled>NEXT</button></footer>
</div>
<div id="overlay"><div id="card"><h2 id="result" class="result win">VICTORY</h2><pre id="stats"></pre><button id="go" class="next" style="width:100%">NEXT WAVE</button><div class="legend"><span class="tag">S = Swarm</span><span class="tag">G = Guard</span><span class="tag">A = Archer</span><span class="tag">! = Exploder</span><span class="tag">N = Necromancer</span></div><p class="note">Judge only Goal 01: impact, target choice, threat readability, dodging, pacing, and whether you want another wave.</p></div></div>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),stage=document.getElementById('stage');
const waveEl=document.getElementById('wave'),threatEl=document.getElementById('threat'),hpEl=document.getElementById('hp'),spdEl=document.getElementById('spd'),eventEl=document.getElementById('event');
const overlay=document.getElementById('overlay'),resultEl=document.getElementById('result'),statsEl=document.getElementById('stats'),go=document.getElementById('go'),nextBtn=document.getElementById('next');
const skillEls={Slash:document.getElementById('sSlash'),Whirlwind:document.getElementById('sWhirl'),Slam:document.getElementById('sSlam')};
let W=0,H=0,dpr=1,speed=1,wave=-1,active=false,last=performance.now(),en=[],fx=[],nums=[],slashes=[],danger=[],shake=0,freeze=0,eventTimer=0;
let kills=0,taken=0,dodges=0,biggest=0,start=0,dmg={},peakNearby=0;
const P={x:0,y:0,hp:500,max:500,r:17,spd:122,atk:0,ww:0,slam:0,spin:0,spinTick:0,wind:0,dead:false,dodge:0,dodgeCd:0,trail:[],facing:0};
const waves=[['SWARM TEST',[['rot',14]]],['FRONTLINE',[['rot',10],['guard',3]]],['RANGED PRESSURE',[['rot',10],['archer',4]]],['THREAT PRIORITY',[['rot',8],['guard',2],['boom',4]]],['SUPPORT TARGET',[['rot',11],['guard',2],['archer',2],['necro',1]]],['ELITE CHECK',[['rot',10],['elite',1]]],['GOREMAW',[['boss',1]]]];
const cfg={rot:{hp:55,dmg:10,spd:92,r:10,col:'#76c44e',range:22,period:.65,label:'S'},guard:{hp:230,dmg:35,spd:47,r:17,col:'#c7c5ba',range:28,period:1.2,label:'G'},archer:{hp:85,dmg:18,spd:63,r:12,col:'#d3568e',range:178,period:1.35,label:'A'},boom:{hp:50,dmg:100,spd:116,r:11,col:'#ff5838',range:30,period:9,label:'!'},necro:{hp:165,dmg:14,spd:50,r:14,col:'#9460d1',range:160,period:1.7,label:'N'},elite:{hp:900,dmg:54,spd:60,r:23,col:'#efa333',range:31,period:1.04,label:'E'},boss:{hp:2600,dmg:66,spd:56,r:34,col:'#b5262a',range:38,period:1.08,label:'B'}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;C.width=Math.max(1,W*dpr);C.height=Math.max(1,H*dpr);X.setTransform(dpr,0,0,dpr,0,0);if(P.x===0){P.x=W/2;P.y=H*.54}}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function announce(t,col='#fff'){eventEl.textContent=t;eventEl.style.color=col;eventEl.classList.add('show');eventTimer=.48}
function spawn(type,x,y){const c=cfg[type];const e={type,x,y,hp:c.hp,max:c.hp,dmg:c.dmg,spd:c.spd,baseSpd:c.spd,r:c.r,col:c.col,range:c.range,period:c.period,basePeriod:c.period,atk:rand(0,.45),special:rand(2.2,4),wind:0,dead:false,mode:'',enraged:false,facing:0};en.push(e);return e}
function begin(i){wave=i>=waves.length?0:i;en=[];fx=[];nums=[];slashes=[];danger=[];P.x=W*.5;P.y=H*.54;P.hp=P.max;P.dead=false;P.atk=P.ww=P.slam=P.spin=P.wind=P.dodge=P.dodgeCd=0;P.trail=[];kills=taken=dodges=0;biggest=0;peakNearby=0;dmg={Slash:0,Whirlwind:0,'Ground Slam':0};freeze=0;shake=0;active=true;start=performance.now();overlay.style.display='none';nextBtn.disabled=true;const all=[];for(const p of waves[wave][1])for(let i=0;i<p[1];i++)all.push(p[0]);all.forEach((t,i)=>{const a=i/all.length*Math.PI*2+rand(-.18,.18),rr=rand(Math.min(W,H)*.32,Math.min(W,H)*.46);spawn(t,clamp(P.x+Math.cos(a)*rr,28,W-28),clamp(P.y+Math.sin(a)*rr,46,H-35))});announce(`WAVE ${wave+1}`, '#9bd7ff');hud()}
function living(){return en.filter(e=>!e.dead)}function nearP(r){return en.filter(e=>!e.dead&&dist(P,e)<=r)}
function targetScore(e){let s=1000-dist(P,e);if(e.type==='boom')s+=720;if(e.type==='necro')s+=560;if(e.type==='archer')s+=125;if(e.type==='boss')s+=90;if(e.type==='elite')s+=70;return s}
function target(){let best=null,bs=-1e9;for(const e of en){if(e.dead)continue;const s=targetScore(e);if(s>bs){bs=s;best=e}}return best}
function burst(x,y,col,n=7,pow=115){for(let i=0;i<n;i++)fx.push({kind:'p',x,y,vx:rand(-pow,pow),vy:rand(-pow,pow),life:rand(.22,.48),max:.48,col,size:rand(2,4)})}
function ring(x,y,max,col,life=.3,width=5){fx.push({kind:'ring',x,y,r:0,max,life,maxLife:life,col,width})}
function hit(e,a,skill,crit=false,kb=0){if(!e||e.dead)return;dmg[skill]+=a;biggest=Math.max(biggest,a);e.hp-=a;nums.push({x:e.x+rand(-5,5),y:e.y-e.r-9,t:(a|0)+(crit?'!':''),life:.6,max:.6,big:crit||a>=150,col:crit?'#ffd46a':'#eef6ff'});burst(e.x,e.y,e.col,crit?10:5,crit?150:95);if(skill==='Slash')slashes.push({x:P.x,y:P.y,a:P.facing,life:.14,max:.14,crit});if(crit){freeze=Math.max(freeze,.045);shake=Math.max(shake,4.5)}if(skill==='Ground Slam'){freeze=Math.max(freeze,.07);shake=Math.max(shake,9)}else if(skill==='Whirlwind')shake=Math.max(shake,2.5);if(kb){const dx=e.x-P.x,dy=e.y-P.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*kb;e.y+=dy/l*kb}if(e.hp<=0){e.dead=true;kills++;burst(e.x,e.y,e.col,12,170);ring(e.x,e.y,18+Math.min(28,a/6),e.col,.2,2);if(a/e.max>1.2)shake=Math.max(shake,4)}}
function damageP(a){if(P.dead||P.dodge>0)return;P.hp-=a;taken+=a;nums.push({x:P.x,y:P.y-28,t:'-'+(a|0),life:.65,max:.65,big:true,col:'#ff727b'});burst(P.x,P.y,'#ff5664',8,110);shake=Math.max(shake,5);if(P.hp<=0){P.dead=true;active=false;finish(false)}}
function addDanger(e,kind,r,time,damage){danger.push({e,kind,r,time,max:time,damage,resolved:false})}
function attemptDodge(){if(P.dodgeCd>0||P.dodge>0)return false;let threat=null;for(const d of danger){if(d.resolved||!d.e||d.e.dead)continue;if(d.time<=.24&&dist(P,d.e)<=d.r+10){threat=d;break}}if(!threat)return false;const dx=P.x-threat.e.x,dy=P.y-threat.e.y,l=Math.hypot(dx,dy)||1;let vx=dx/l,vy=dy/l;if(threat.kind==='charge'){const side=Math.random()<.5?-1:1;vx=-dy/l*side;vy=dx/l*side}P.x=clamp(P.x+vx*70,22,W-22);P.y=clamp(P.y+vy*70,38,H-28);P.dodge=.18;P.dodgeCd=1.2;P.trail.push({x:P.x-vx*28,y:P.y-vy*28,life:.22,max:.22});dodges++;announce('DODGE','#7fe9ff');ring(P.x,P.y,28,'#6adfff',.22,3);return true}
function upPlayer(dt){P.atk=Math.max(0,P.atk-dt);P.ww=Math.max(0,P.ww-dt);P.slam=Math.max(0,P.slam-dt);P.dodge=Math.max(0,P.dodge-dt);P.dodgeCd=Math.max(0,P.dodgeCd-dt);if(P.dead)return;if(attemptDodge())return;if(P.wind>0){P.wind-=dt;if(P.wind<=0){announce('GROUND SLAM','#ffc056');ring(P.x,P.y,102,'#ffc056',.34,6);for(const e of nearP(102))hit(e,175,'Ground Slam',false,30)}return}if(P.spin>0){P.spin-=dt;P.spinTick-=dt;const t=target();if(t){const dx=t.x-P.x,dy=t.y-P.y,l=Math.hypot(dx,dy)||1;P.facing=Math.atan2(dy,dx);P.x+=dx/l*P.spd*.7*dt;P.y+=dy/l*P.spd*.7*dt}if(P.spinTick<=0){P.spinTick=.25;for(const e of nearP(66))hit(e,30,'Whirlwind',false,-2)}return}const t=target();if(!t)return;peakNearby=Math.max(peakNearby,nearP(110).length);if(P.slam<=0&&nearP(102).length>=4){P.slam=7;P.wind=.55;announce('SLAM WINDUP','#ffc056');return}if(P.ww<=0&&nearP(66).length>=3){P.ww=5;P.spin=1.5;P.spinTick=0;announce('WHIRLWIND','#7edcff');return}const d=dist(P,t),dx=t.x-P.x,dy=t.y-P.y,l=Math.hypot(dx,dy)||1;P.facing=Math.atan2(dy,dx);if(d<=36&&P.atk<=0){P.atk=.8;const crit=Math.random()<.07,a=rand(35,45)*(crit?1.8:1);hit(t,a,'Slash',crit,crit?14:6)}else{P.x+=dx/l*P.spd*dt;P.y+=dy/l*P.spd*dt}P.x=clamp(P.x,20,W-20);P.y=clamp(P.y,38,H-28)}
function enemyAttack(e){if(e.type==='archer'||e.type==='necro')slashes.push({x:e.x,y:e.y,a:Math.atan2(P.y-e.y,P.x-e.x),life:.12,max:.12,enemy:true,col:e.col});damageP(e.dmg)}
function startBossMove(e){const roll=Math.random();if(roll<.34){e.mode='cleave';e.wind=.7;addDanger(e,'cleave',95,.7,110);threatEl.textContent='Goremaw raises the cleaver'}else if(roll<.68){e.mode='rupture';e.wind=.9;addDanger(e,'rupture',155,.9,86);threatEl.textContent='Ground rupture incoming'}else{e.mode='charge';e.wind=.72;e.chargeTarget={x:P.x,y:P.y};addDanger(e,'charge',65,.72,125);threatEl.textContent='Goremaw prepares to CHARGE'}e.special=rand(2.9,4.2)}
function resolveBoss(e){if(e.mode==='cleave'){ring(e.x,e.y,95,'#ff653a',.3,7);if(dist(P,e)<=95)damageP(110);shake=Math.max(shake,7)}else if(e.mode==='rupture'){ring(e.x,e.y,155,'#ff9d3d',.4,7);if(dist(P,e)<=155)damageP(86);shake=Math.max(shake,8)}else if(e.mode==='charge'){const tx=e.chargeTarget?.x??P.x,ty=e.chargeTarget?.y??P.y,dx=tx-e.x,dy=ty-e.y,l=Math.hypot(dx,dy)||1,sx=e.x,sy=e.y;e.x=clamp(e.x+dx/l*210,30,W-30);e.y=clamp(e.y+dy/l*210,45,H-30);slashes.push({x:sx,y:sy,x2:e.x,y2:e.y,life:.2,max:.2,charge:true,col:'#ff4e37'});ring(e.x,e.y,62,'#ff4e37',.25,6);if(Math.hypot(P.x-e.x,P.y-e.y)<62)damageP(125);shake=Math.max(shake,10)}e.mode='';threatEl.textContent='Goal 01 v2 — combat feel'}
function upEnemy(e,dt){if(e.dead||P.dead)return;e.atk=Math.max(0,e.atk-dt);e.special=Math.max(0,e.special-dt);let d=dist(e,P);if(e.type==='boom'){if(e.wind>0){e.wind-=dt;const dd=danger.find(q=>q.e===e&&!q.resolved);if(dd)dd.time=e.wind;if(e.wind<=0){if(dd)dd.resolved=true;ring(e.x,e.y,76,'#ff3d25',.32,6);if(d<76)damageP(e.dmg);e.dead=true;burst(e.x,e.y,'#ff4d2d',14,180);shake=Math.max(shake,9)}return}if(d<e.range){e.wind=.82;addDanger(e,'boom',76,.82,e.dmg);return}}
if(e.type==='necro'&&e.special<=0){e.special=4.7;if(living().length<29){for(let i=0;i<2;i++)spawn('rot',clamp(e.x+rand(-48,48),20,W-20),clamp(e.y+rand(-48,48),38,H-28));announce('RAISE DEAD','#b887f2')}for(const q of en)if(!q.dead&&q!==e&&dist(e,q)<125)q.hp=Math.min(q.max,q.hp+20);ring(e.x,e.y,125,'#9b6fd3',.45,2)}
if(e.type==='boss'){if(!e.enraged&&e.hp/e.max<=.30){e.enraged=true;e.spd*=1.28;e.period*=.72;announce('GOREMAW ENRAGED','#ff4b4b');shake=Math.max(shake,8)}if(e.wind>0){e.wind-=dt;const dd=danger.find(q=>q.e===e&&!q.resolved);if(dd)dd.time=e.wind;if(e.wind<=0){if(dd)dd.resolved=true;resolveBoss(e)}return}if(e.special<=0){startBossMove(e);return}}
if(e.type==='elite'){const chunks=Math.floor((1-e.hp/e.max)/.2),mult=1+chunks*.09;e.spd=e.baseSpd*mult;e.period=e.basePeriod/mult;if(chunks>=3&&!e.enraged){e.enraged=true;announce('ELITE FRENZY','#ff9d35')}}
const pref=(e.type==='archer'||e.type==='necro')?e.range*.78:0;if(pref){if(d>pref+15||d<pref-32){const dir=d>pref?1:-1,dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;e.facing=Math.atan2(dy,dx);e.x+=dx/l*e.spd*dt*dir;e.y+=dy/l*e.spd*dt*dir}}else if(d>e.range){const dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;e.facing=Math.atan2(dy,dx);e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt}if(d<=e.range&&e.atk<=0){e.atk=e.period;enemyAttack(e)}e.x=clamp(e.x,18,W-18);e.y=clamp(e.y,34,H-24)}
function finish(win){active=false;const sec=(performance.now()-start)/1000,total=Object.values(dmg).reduce((a,b)=>a+b,0),lines=[win?'VICTORY':'DEFEAT','',`Duration       ${sec.toFixed(1)}s`,`Damage dealt  ${total|0}`,`Damage taken  ${taken|0}`,`Kills         ${kills}`,`Threat dodges ${dodges}`,`Biggest hit   ${biggest|0}`,`Peak surround ${peakNearby}`,''];Object.entries(dmg).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>lines.push(`${k.padEnd(14)} ${total?(v/total*100).toFixed(1):0}%`));resultEl.textContent=win?'VICTORY':'DEFEAT';resultEl.className='result '+(win?'win':'loss');statsEl.textContent=lines.join('\n');go.textContent=win?(wave===waves.length-1?'REPLAY FROM WAVE 1':'NEXT WAVE'):'RETRY WAVE';overlay.style.display='flex';nextBtn.disabled=false;announce(win?'ROOM CLEARED':'BUILD FAILED',win?'#ffd171':'#ff727b')}
function hud(){waveEl.textContent=`WAVE ${wave+1}/7 — ${waves[wave]?.[0]||''}`;hpEl.textContent=`HP ${Math.max(0,P.hp|0)}/${P.max}`;hpEl.classList.toggle('low',P.hp/P.max<.3);spdEl.textContent=speed+'×';const specs=[[skillEls.Slash,P.atk,.8],[skillEls.Whirlwind,P.ww,5],[skillEls.Slam,P.slam,7]];for(const [el,cd,max] of specs){const ready=cd<=0;el.classList.toggle('ready',ready);el.querySelector('.cd').textContent=ready?'READY':`${cd.toFixed(1)}s`;el.querySelector('.fill').style.width=`${100*(1-cd/max)}%`}}
function circ(o,r,c){X.beginPath();X.arc(o.x,o.y,r,0,Math.PI*2);X.fillStyle='#0b111b';X.fill();X.lineWidth=2;X.strokeStyle='#020509';X.stroke();X.beginPath();X.arc(o.x,o.y,r-2,0,Math.PI*2);X.fillStyle=c;X.fill()}
function drawEnemy(e){circ(e,e.r,e.col);if(e.type==='guard'){X.strokeStyle='#eff3e8';X.lineWidth=3;X.strokeRect(e.x-7,e.y-9,6,18)}else if(e.type==='archer'){X.strokeStyle='#fff';X.lineWidth=2;X.beginPath();X.arc(e.x,e.y,7,-1.1,1.1);X.stroke()}else if(e.type==='boom'){X.fillStyle='#210000';X.font='900 15px system-ui';X.textAlign='center';X.fillText('!',e.x,e.y+5)}else if(e.type==='necro'){X.strokeStyle='#e4caff';X.beginPath();X.arc(e.x,e.y,e.r+5,0,Math.PI*2);X.stroke()}else if(e.type==='elite'){X.strokeStyle='#ff7e24';X.lineWidth=4;X.beginPath();X.arc(e.x,e.y,e.r+6,0,Math.PI*2);X.stroke()}else if(e.type==='boss'){X.strokeStyle=e.enraged?'#ff3038':'#ff6a53';X.lineWidth=5;X.beginPath();X.arc(e.x,e.y,e.r+7,0,Math.PI*2);X.stroke();X.fillStyle='#fff';X.font='900 11px system-ui';X.textAlign='center';X.fillText('GOREMAW',e.x,e.y-e.r-15)}else{X.fillStyle='#11210c';X.beginPath();X.arc(e.x,e.y,3,0,Math.PI*2);X.fill()}X.fillStyle='#301014';X.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);X.fillStyle=e.type==='boss'?'#ff4b4f':'#55df6c';X.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.max),3);if(e.wind>0){const rr=e.type==='boom'?76:e.mode==='cleave'?95:e.mode==='rupture'?155:e.mode==='charge'?65:45;X.strokeStyle=e.type==='boom'?'#ff4129':e.mode==='charge'?'#ff2d33':'#ff9b40';X.globalAlpha=.65+.25*Math.sin(performance.now()/60);X.lineWidth=4;X.beginPath();X.arc(e.x,e.y,rr,0,Math.PI*2);X.stroke();X.globalAlpha=1}}
function draw(){X.save();const sx=shake>0?rand(-shake,shake):0,sy=shake>0?rand(-shake,shake):0;X.translate(sx,sy);X.clearRect(-15,-15,W+30,H+30);const g=X.createRadialGradient(W*.5,H*.48,20,W*.5,H*.48,Math.max(W,H)*.75);g.addColorStop(0,'#142131');g.addColorStop(.55,'#0c131e');g.addColorStop(1,'#060a10');X.fillStyle=g;X.fillRect(-15,-15,W+30,H+30);X.strokeStyle='#172436';X.lineWidth=1;for(let i=0;i<W;i+=48){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}for(let i=0;i<H;i+=48){X.beginPath();X.moveTo(0,i);X.lineTo(W,i);X.stroke()}for(const f of fx){if(f.kind==='ring'){X.globalAlpha=Math.max(0,f.life/f.maxLife);X.beginPath();X.arc(f.x,f.y,f.r,0,Math.PI*2);X.strokeStyle=f.col;X.lineWidth=f.width;X.stroke();X.globalAlpha=1}else{X.globalAlpha=Math.max(0,f.life/f.max);X.fillStyle=f.col;X.fillRect(f.x,f.y,f.size,f.size);X.globalAlpha=1}}for(const s of slashes){X.globalAlpha=Math.max(0,s.life/s.max);X.strokeStyle=s.col||(s.enemy?'#ff9bca':s.crit?'#ffe17d':'#d9f2ff');X.lineWidth=s.charge?10:(s.crit?8:5);X.beginPath();if(s.charge){X.moveTo(s.x,s.y);X.lineTo(s.x2,s.y2)}else X.arc(s.x,s.y,s.enemy?22:32,s.a-.75,s.a+.75);X.stroke();X.globalAlpha=1}for(const e of en)if(!e.dead)drawEnemy(e);for(const t of P.trail){X.globalAlpha=t.life/t.max;circ(t,12,'#5bd8ff');X.globalAlpha=1}circ(P,P.r,P.dead?'#56606c':P.dodge>0?'#7ee9ff':'#469cff');X.strokeStyle='#d9efff';X.lineWidth=5;X.beginPath();X.moveTo(P.x+Math.cos(P.facing)*10,P.y+Math.sin(P.facing)*10);X.lineTo(P.x+Math.cos(P.facing)*31,P.y+Math.sin(P.facing)*31);X.stroke();if(P.spin>0){X.strokeStyle='#72d9ff';X.lineWidth=5;X.beginPath();X.arc(P.x,P.y,66,0,Math.PI*2);X.stroke()}if(P.wind>0){X.strokeStyle='#ffc055';X.lineWidth=6;X.beginPath();X.arc(P.x,P.y,102*(1-P.wind/.55),0,Math.PI*2);X.stroke()}for(const n of nums){X.globalAlpha=Math.max(0,n.life/n.max);X.fillStyle=n.col;X.textAlign='center';X.font=`900 ${n.big?21:15}px system-ui`;X.fillText(n.t,n.x,n.y);X.globalAlpha=1}X.restore()}
function updateFx(dt){for(const f of fx){if(f.kind==='ring'){f.r+=(f.max-f.r)*13*dt;f.life-=dt}else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96;f.life-=dt}}fx=fx.filter(f=>f.life>0);for(const n of nums){n.y-=31*dt;n.life-=dt}nums=nums.filter(n=>n.life>0);for(const s of slashes)s.life-=dt;slashes=slashes.filter(s=>s.life>0);for(const t of P.trail)t.life-=dt;P.trail=P.trail.filter(t=>t.life>0);for(const d of danger)if(!d.resolved&&d.e?.dead)d.resolved=true;danger=danger.filter(d=>!d.resolved&&d.e&&!d.e.dead)}
function loop(t){let dt=Math.min(.035,(t-last)/1000)*speed;last=t;if(freeze>0){freeze-=dt;dt=0}if(eventTimer>0){eventTimer-=Math.max(.016,(t-(loop.prev||t))/1000);if(eventTimer<=0)eventEl.classList.remove('show')}loop.prev=t;if(active&&dt>0){upPlayer(dt);for(const e of en)upEnemy(e,dt);updateFx(dt);shake=Math.max(0,shake-22*dt);if(!P.dead&&!en.some(e=>!e.dead))finish(true);hud()}else if(dt>0){updateFx(dt);shake=Math.max(0,shake-22*dt)}draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(q=>q.classList.toggle('on',q===b));hud()});function nextWave(){if(active)return;begin(P.dead?wave:(wave===waves.length-1?0:wave+1))}nextBtn.onclick=nextWave;go.onclick=nextWave;addEventListener('keydown',e=>{if('123'.includes(e.key)){speed=+e.key;document.querySelectorAll('[data-s]').forEach(q=>q.classList.toggle('on',q.dataset.s===e.key));hud()}if(e.code==='Space')nextWave()});setTimeout(()=>begin(0),80);requestAnimationFrame(loop);
</script>
</body></html>
