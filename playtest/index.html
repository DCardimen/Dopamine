<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dopamine — Goal 01 Playtest</title><style>
html,body{margin:0;height:100%;background:#090d14;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#wrap{height:100%;display:flex;flex-direction:column}#top{height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#111827;border-bottom:1px solid #263244;font-size:14px}#wave{font-weight:800;flex:1}.pill{background:#1b2638;border:1px solid #34445f;padding:7px 10px;border-radius:12px}canvas{display:block;width:100%;flex:1;touch-action:none}#bottom{display:flex;gap:8px;padding:10px;background:#111827;border-top:1px solid #263244}.btn{flex:1;padding:13px 8px;border:1px solid #405273;background:#1a2638;color:#eef4ff;border-radius:12px;font-weight:800;font-size:14px}.btn.active{background:#365d99}.btn.gold{background:#84581a;border-color:#d39a3d}#overlay{position:fixed;inset:58px 0 66px;display:none;align-items:center;justify-content:center;background:#060a10cc;padding:20px;text-align:center}#card{max-width:420px;background:#111827;border:1px solid #35445f;border-radius:18px;padding:22px;box-shadow:0 20px 80px #000b}h2{margin:0 0 12px}pre{white-space:pre-wrap;text-align:left;background:#090d14;padding:12px;border-radius:10px;line-height:1.5}.small{opacity:.72;font-size:12px}</style></head><body><div id="wrap"><div id="top"><div id="wave">DOPAMINE</div><div id="hp" class="pill">HP 500/500</div><div id="speed" class="pill">1×</div></div><canvas id="c"></canvas><div id="bottom"><button class="btn active" data-sp="1">1×</button><button class="btn" data-sp="2">2×</button><button class="btn" data-sp="3">3×</button><button id="next" class="btn gold" disabled>NEXT</button></div></div><div id="overlay"><div id="card"><h2 id="ot">Victory</h2><pre id="stats"></pre><button id="overlayNext" class="btn gold">NEXT WAVE</button><p class="small">Goal 01 graybox: judge combat rhythm, target choice, impact, readability, and whether you want another wave.</p></div></div><script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const waves=[['SWARM TEST',[['rot',12]]],['FRONTLINE',[['rot',8],['guard',3]]],['RANGED PRESSURE',[['rot',10],['archer',4]]],['THREAT PRIORITY',[['rot',8],['guard',2],['boom',3]]],['SUPPORT TARGET',[['rot',10],['guard',2],['archer',2],['necro',1]]],['ELITE CHECK',[['rot',8],['elite',1]]],['GOREMAW',[['boss',1]]]];
const cfg={rot:{hp:55,dmg:10,spd:85,r:10,col:'#75bf49',range:22,period:.65},guard:{hp:220,dmg:35,spd:45,r:16,col:'#c1c0b5',range:26,period:1.2},archer:{hp:80,dmg:18,spd:60,r:12,col:'#c85085',range:170,period:1.35},boom:{hp:45,dmg:90,spd:110,r:11,col:'#f65330',range:28,period:9},necro:{hp:150,dmg:14,spd:48,r:14,col:'#8750c8',range:150,period:1.7},elite:{hp:880,dmg:52,spd:58,r:22,col:'#e79627',range:30,period:1.05},boss:{hp:2500,dmg:64,spd:52,r:32,col:'#a31f1f',range:36,period:1.1}};
let wave=-1,en=[],parts=[],nums=[],rings=[],speed=1,active=false,start=0,kills=0,taken=0,dmg={Slash:0,Whirlwind:0,'Ground Slam':0};
const P={x:0,y:0,hp:500,max:500,r:16,spd:118,atk:0,ww:0,slam:0,spin:0,spinTick:0,wind:0,target:null,dead:false};
function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function spawn(type,px,py){let c=cfg[type],e={type,x:px,y:py,hp:c.hp,max:c.hp,dmg:c.dmg,spd:c.spd,r:c.r,col:c.col,range:c.range,period:c.period,atk:rand(0,.5),dead:false,wind:0,special:rand(2.5,4.5)};en.push(e);return e}
function startWave(i){wave=i>=waves.length?0:i;en=[];parts=[];nums=[];rings=[];P.x=W*.5;P.y=H*.54;P.hp=P.max;P.dead=false;P.atk=P.ww=P.slam=P.spin=P.wind=0;P.target=null;kills=taken=0;dmg={Slash:0,Whirlwind:0,'Ground Slam':0};active=true;start=performance.now();document.getElementById('overlay').style.display='none';document.getElementById('next').disabled=true;let list=[];for(let p of waves[wave][1])for(let i=0;i<p[1];i++)list.push(p[0]);list.forEach((t,i)=>{let a=i/list.length*Math.PI*2+rand(-.18,.18),r=rand(Math.min(W,H)*.3,Math.min(W,H)*.45);spawn(t,clamp(P.x+Math.cos(a)*r,30,W-30),clamp(P.y+Math.sin(a)*r,45,H-35))});hud()}
function targetScore(e){let s=1000-dist(P,e);if(e.type==='boom')s+=650;if(e.type==='necro')s+=500;if(e.type==='archer')s+=120;if(e.type==='boss')s+=80;return s}
function chooseTarget(){let best=null,bs=-1e9;for(let e of en)if(!e.dead){let s=targetScore(e);if(s>bs){bs=s;best=e}}return best}
function nearby(r){return en.filter(e=>!e.dead&&dist(P,e)<=r)}
function hurt(e,a,skill,crit=false,kb=0){if(e.dead)return;dmg[skill]+=a;e.hp-=a;nums.push({x:e.x,y:e.y-18,t:(a|0)+(crit?'!':''),life:.55,big:crit});for(let i=0;i<3;i++)parts.push({x:e.x,y:e.y,vx:rand(-50,50),vy:rand(-50,50),life:.25,col:e.col});if(kb){let dx=e.x-P.x,dy=e.y-P.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*kb;e.y+=dy/l*kb}if(e.hp<=0){e.dead=true;kills++;for(let i=0;i<9;i++)parts.push({x:e.x,y:e.y,vx:rand(-120,120),vy:rand(-120,120),life:.45,col:e.col})}}
function damageP(a){if(P.dead)return;P.hp-=a;taken+=a;nums.push({x:P.x,y:P.y-24,t:'-'+(a|0),life:.6,big:true,col:'#ff7070'});if(P.hp<=0){P.dead=true;active=false;finish(false)}}
function updatePlayer(dt){P.atk=Math.max(0,P.atk-dt);P.ww=Math.max(0,P.ww-dt);P.slam=Math.max(0,P.slam-dt);if(P.dead)return;if(P.wind>0){P.wind-=dt;if(P.wind<=0){rings.push({x:P.x,y:P.y,r:0,max:95,life:.25,col:'#ffbf45'});for(let e of nearby(95))hurt(e,175,'Ground Slam',false,26)}return}if(P.spin>0){P.spin-=dt;P.spinTick-=dt;P.target=chooseTarget();if(P.target){let dx=P.target.x-P.x,dy=P.target.y-P.y,l=Math.hypot(dx,dy)||1;P.x+=dx/l*P.spd*.7*dt;P.y+=dy/l*P.spd*.7*dt}if(P.spinTick<=0){P.spinTick=.25;for(let e of nearby(62))hurt(e,30,'Whirlwind',false,-2)}return}P.target=chooseTarget();if(!P.target)return;let near=nearby(95);if(P.slam<=0&&near.length>=4){P.slam=7;P.wind=.55;return}if(P.ww<=0&&nearby(62).length>=3){P.ww=5;P.spin=1.5;P.spinTick=0;return}let d=dist(P,P.target);if(d<=34&&P.atk<=0){P.atk=.8;let crit=Math.random()<.05,a=rand(35,45)*(crit?1.75:1);hurt(P.target,a,'Slash',crit,crit?12:5)}else{let dx=P.target.x-P.x,dy=P.target.y-P.y,l=Math.hypot(dx,dy)||1;P.x+=dx/l*P.spd*dt;P.y+=dy/l*P.spd*dt}P.x=clamp(P.x,22,W-22);P.y=clamp(P.y,35,H-25)}
function updateEnemy(e,dt){if(e.dead||P.dead)return;e.atk=Math.max(0,e.atk-dt);e.special=Math.max(0,e.special-dt);let d=dist(e,P);if(e.type==='boom'){if(e.wind>0){e.wind-=dt;if(e.wind<=0){rings.push({x:e.x,y:e.y,r:0,max:70,life:.3,col:'#ff3c22'});if(d<70)damageP(e.dmg);e.dead=true}return}if(d<e.range){e.wind=.8;return}}
if(e.type==='necro'&&e.special<=0){e.special=5;if(en.filter(q=>!q.dead).length<28){for(let i=0;i<2;i++)spawn('rot',clamp(e.x+rand(-45,45),20,W-20),clamp(e.y+rand(-45,45),35,H-25))}for(let q of en)if(!q.dead&&q!==e&&dist(e,q)<120)q.hp=Math.min(q.max,q.hp+18)}
if(e.type==='boss'&&e.special<=0){e.special=rand(3.3,4.8);e.wind=rand(.55,.85);e.boss=Math.random()<.5?'cleave':'rupture';return}if(e.type==='boss'&&e.wind>0){e.wind-=dt;if(e.wind<=0){let rr=e.boss==='cleave'?85:140;rings.push({x:e.x,y:e.y,r:0,max:rr,life:.28,col:'#ff6928'});if(d<rr)damageP(e.boss==='cleave'?105:82)}return}
let pref=(e.type==='archer'||e.type==='necro')?e.range*.78:0;if(pref){if(d>pref+15||d<pref-30){let dir=d>pref?1:-1,dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.spd*dt*dir;e.y+=dy/l*e.spd*dt*dir}}else if(d>e.range){let dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt}if(d<=e.range&&e.atk<=0){e.atk=e.period;damageP(e.dmg)}if(e.type==='elite'){let chunks=Math.floor((1-e.hp/e.max)/.2);e.spd=cfg.elite.spd*(1+chunks*.08);e.period=cfg.elite.period/(1+chunks*.08)}e.x=clamp(e.x,18,W-18);e.y=clamp(e.y,30,H-20)}
function finish(win){active=false;let secs=(performance.now()-start)/1000,total=Object.values(dmg).reduce((a,b)=>a+b,0);let lines=[win?'VICTORY':'DEFEAT','',`Duration      ${secs.toFixed(1)}s`,`Damage dealt ${total|0}`,`Damage taken ${taken|0}`,`Kills        ${kills}`,''];Object.entries(dmg).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>lines.push(`${k.padEnd(13)} ${total?((v/total*100).toFixed(1)+'%'):'0%'}`));document.getElementById('ot').textContent=win?'VICTORY':'DEFEAT';document.getElementById('stats').textContent=lines.join('\n');document.getElementById('overlayNext').textContent=win?(wave===waves.length-1?'REPLAY FROM WAVE 1':'NEXT WAVE'):'RETRY WAVE';document.getElementById('overlay').style.display='flex';document.getElementById('next').disabled=false}
function hud(){document.getElementById('wave').textContent=`WAVE ${wave+1}/${waves.length} — ${waves[wave][0]}`;document.getElementById('hp').textContent=`HP ${Math.max(0,P.hp|0)}/${P.max}`;document.getElementById('speed').textContent=speed+'×'}
function circle(o,r,col){x.beginPath();x.arc(o.x,o.y,r,0,Math.PI*2);x.fillStyle='#101722';x.fill();x.lineWidth=2;x.strokeStyle='#030609';x.stroke();x.beginPath();x.arc(o.x,o.y,r-2,0,Math.PI*2);x.fillStyle=col;x.fill()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#0c121b';x.fillRect(0,0,W,H);x.strokeStyle='#162131';x.lineWidth=1;for(let gx=0;gx<W;gx+=48){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=0;gy<H;gy+=48){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}for(let r of rings){x.beginPath();x.arc(r.x,r.y,r.r,0,Math.PI*2);x.strokeStyle=r.col;x.globalAlpha=Math.max(0,r.life/.3);x.lineWidth=5;x.stroke();x.globalAlpha=1}for(let e of en)if(!e.dead){circle(e,e.r,e.col);x.fillStyle='#2a0b0b';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);x.fillStyle='#53dd69';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.max),3);if(e.wind>0){x.strokeStyle=e.type==='boom'?'#ff3b22':'#ff9d38';x.lineWidth=3;x.beginPath();x.arc(e.x,e.y,e.type==='boss'?90:42,0,Math.PI*2);x.stroke()}}circle(P,P.r,P.dead?'#535d69':'#479cff');x.strokeStyle='#d6ebff';x.lineWidth=4;x.beginPath();x.moveTo(P.x+8,P.y-3);x.lineTo(P.x+25,P.y-15);x.stroke();if(P.spin>0){x.strokeStyle='#75d7ff';x.lineWidth=4;x.beginPath();x.arc(P.x,P.y,62,0,Math.PI*2);x.stroke()}if(P.wind>0){x.strokeStyle='#ffc04b';x.lineWidth=5;x.beginPath();x.arc(P.x,P.y,95*(1-P.wind/.55),0,Math.PI*2);x.stroke()}for(let p of parts){x.globalAlpha=Math.max(0,p.life/.45);x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3);x.globalAlpha=1}for(let n of nums){x.globalAlpha=Math.max(0,n.life/.6);x.fillStyle=n.col||'#f2f6ff';x.font=`${n.big?20:15}px system-ui`;x.fontWeight='800';x.fillText(n.t,n.x,n.y);x.globalAlpha=1}}
let last=performance.now();function loop(t){let dt=Math.min(.035,(t-last)/1000)*speed;last=t;if(active){updatePlayer(dt);for(let e of en)updateEnemy(e,dt);for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);for(let n of nums){n.y-=32*dt;n.life-=dt}nums=nums.filter(n=>n.life>0);for(let r of rings){r.r+=(r.max-r.r)*12*dt;r.life-=dt}rings=rings.filter(r=>r.life>0);if(!P.dead&&!en.some(e=>!e.dead))finish(true);hud()}draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(q=>q.classList.toggle('active',q===b));hud()});function next(){if(active)return;if(P.dead)startWave(wave);else startWave(wave===waves.length-1?0:wave+1)}document.getElementById('next').onclick=next;document.getElementById('overlayNext').onclick=next;document.addEventListener('keydown',e=>{if(e.key==='1'||e.key==='2'||e.key==='3'){speed=+e.key;document.querySelectorAll('[data-sp]').forEach(q=>q.classList.toggle('active',q.dataset.sp===e.key));hud()}if(e.code==='Space')next()});setTimeout(()=>startWave(0),80);requestAnimationFrame(loop);
</script></body></html>
