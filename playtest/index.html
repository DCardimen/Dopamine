<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b11;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 35%,#101b29 0,#080d14 58%,#05080d 100%)}header{min-height:64px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;background:#0c1420ee;border-bottom:1px solid #29384f;z-index:3}.title{font-weight:900;font-size:13px;letter-spacing:.03em}.sub{font-size:10px;opacity:.72;margin-top:3px}.pill{border:1px solid #354863;background:#152235;padding:8px 9px;border-radius:11px;font-weight:850;font-size:12px;white-space:nowrap}#hp.low{border-color:#9d3a45;background:#391822;color:#ffd9dd}#stage{position:relative;flex:1;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#event{position:absolute;top:14%;left:50%;transform:translate(-50%,-50%) scale(.88);opacity:0;font-weight:1000;font-size:clamp(19px,6vw,32px);letter-spacing:.06em;pointer-events:none;text-shadow:0 3px 16px #000;transition:opacity .07s,transform .07s}#event.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#skills{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;pointer-events:none}.skill{border:1px solid #384d69;background:#101b2ae8;border-radius:10px;padding:7px 8px;min-height:42px}.skill .name{font-size:10px;font-weight:900}.skill .cd{font-size:11px;margin-top:2px;font-weight:800}.skill.ready{border-color:#5aa4d4;box-shadow:0 0 12px #2c8fcb35 inset}.slam.ready{border-color:#db9d3f;box-shadow:0 0 12px #d5862935 inset}footer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:#0c1420;border-top:1px solid #29384f}button{min-height:44px;border:1px solid #3c5170;background:#152235;color:#eef4ff;border-radius:11px;font-weight:900;font-size:13px}button.on{background:#315a8d}button.next{background:#7c541b;border-color:#d19941}button:disabled{opacity:.35}#overlay{position:fixed;inset:64px 0 61px;display:none;align-items:center;justify-content:center;background:#03060ad8;padding:16px;z-index:8}#card{width:min(430px,94vw);max-height:90%;overflow:auto;background:#0e1826;border:1px solid #3b506f;border-radius:18px;padding:19px;box-shadow:0 25px 80px #000}.result{text-align:center;font-size:28px;font-weight:1000;margin:0 0 10px}.win{color:#ffd171}.loss{color:#ff7c86}pre{white-space:pre-wrap;background:#080e16;padding:12px;border-radius:11px;line-height:1.42;font-size:12px}.note{font-size:11px;opacity:.65;text-align:center;line-height:1.4}</style>

<div id="app"><header><div><div id="wave" class="title">DOPAMINE</div><div id="threat" class="sub">Goal 01 v2.2 • 20% armor • +3 HP/s • +6 HP/kill</div></div><div id="hp" class="pill">HP 500/500</div><div id="spd" class="pill">1×</div></header><div id="stage"><canvas id="c"></canvas><div id="event"></div><div id="skills"><div id="sSlash" class="skill"><div class="name">HEAVY SLASH</div><div class="cd">READY</div></div><div id="sWhirl" class="skill"><div class="name">WHIRLWIND</div><div class="cd">READY</div></div><div id="sSlam" class="skill slam"><div class="name">GROUND SLAM</div><div class="cd">READY</div></div></div></div><footer><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button><button id="next" class="next" disabled>NEXT</button></footer></div>
<div id="overlay"><div id="card"><h2 id="result" class="result win">VICTORY</h2><pre id="stats"></pre><button id="go" class="next" style="width:100%">NEXT WAVE</button><p class="note">Goal 01 only: combat rhythm, target choice, impact, threat readability, survivability, and “one more wave.”</p></div></div>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),stage=document.getElementById('stage');
const waveEl=document.getElementById('wave'),threatEl=document.getElementById('threat'),hpEl=document.getElementById('hp'),spdEl=document.getElementById('spd'),eventEl=document.getElementById('event'),overlayEl=document.getElementById('overlay'),resultEl=document.getElementById('result'),statsEl=document.getElementById('stats'),goBtn=document.getElementById('go'),nextBtn=document.getElementById('next');
const skillEls={Slash:document.getElementById('sSlash'),Whirlwind:document.getElementById('sWhirl'),Slam:document.getElementById('sSlam')};
let W=0,H=0,DPR=1,speed=1,wave=-1,active=false,last=performance.now(),en=[],fx=[],nums=[],arcs=[],freeze=0,eventTimer=0,shake=0,kills=0,taken=0,dodges=0,start=0,dmg={},biggest=0;
const P={x:0,y:0,hp:500,max:500,r:17,spd:122,atk:0,ww:0,slam:0,spin:0,spinTick:0,wind:0,dead:false,dodge:0,dodgeCd:0,facing:0};
const waves=[['SWARM TEST',[['rot',14]]],['FRONTLINE',[['rot',10],['guard',3]]],['RANGED PRESSURE',[['rot',10],['archer',4]]],['THREAT PRIORITY',[['rot',8],['guard',2],['boom',4]]],['SUPPORT TARGET',[['rot',11],['guard',2],['archer',2],['necro',1]]],['ELITE CHECK',[['rot',10],['elite',1]]],['GOREMAW',[['boss',1]]]];
const cfg={rot:{hp:55,dmg:10,spd:92,r:10,col:'#76c44e',range:22,period:.65},guard:{hp:230,dmg:28,spd:47,r:17,col:'#c7c5ba',range:28,period:1.2},archer:{hp:85,dmg:15,spd:63,r:12,col:'#d3568e',range:178,period:1.35},boom:{hp:50,dmg:100,spd:116,r:11,col:'#ff5838',range:30,period:9},necro:{hp:165,dmg:10,spd:50,r:14,col:'#9460d1',range:160,period:1.7},elite:{hp:850,dmg:30,spd:60,r:23,col:'#efa333',range:31,period:1.15},boss:{hp:2400,dmg:22,spd:56,r:34,col:'#b5262a',range:38,period:1.3}};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;C.width=Math.max(1,W*DPR);C.height=Math.max(1,H*DPR);X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function announce(t,c='#fff'){eventEl.textContent=t;eventEl.style.color=c;eventEl.classList.add('show');eventTimer=.48}
function spawn(type,x,y){const c=cfg[type];en.push({type,x,y,hp:c.hp,max:c.hp,dmg:c.dmg,spd:c.spd,baseSpd:c.spd,r:c.r,col:c.col,range:c.range,period:c.period,basePeriod:c.period,atk:R(0,.4),special:R(2.2,4),wind:0,mode:'',dead:false,enraged:false,chargeTarget:null})}
function begin(i){wave=i>=waves.length?0:i;en=[];fx=[];nums=[];arcs=[];P.x=W*.5;P.y=H*.54;P.hp=P.max;P.dead=false;P.atk=P.ww=P.slam=P.spin=P.wind=P.dodge=P.dodgeCd=0;kills=taken=dodges=0;biggest=0;dmg={Slash:0,Whirlwind:0,'Ground Slam':0};freeze=shake=0;active=true;start=performance.now();overlayEl.style.display='none';nextBtn.disabled=true;const all=[];for(const p of waves[wave][1])for(let j=0;j<p[1];j++)all.push(p[0]);all.forEach((t,j)=>{const a=j/all.length*Math.PI*2+R(-.18,.18),rr=R(Math.min(W,H)*.32,Math.min(W,H)*.46);spawn(t,cl(P.x+Math.cos(a)*rr,28,W-28),cl(P.y+Math.sin(a)*rr,46,H-35))});announce('WAVE '+(wave+1),'#9bd7ff');hud()}
function target(){let best=null,bs=-1e9;for(const e of en){if(e.dead)continue;let s=1000-dist(P,e)+(e.type==='boom'?720:e.type==='necro'?560:e.type==='archer'?125:e.type==='boss'?90:e.type==='elite'?70:0);if(s>bs){bs=s;best=e}}return best}
function near(r){return en.filter(e=>!e.dead&&dist(P,e)<=r)}function ring(x,y,m,c,w=5){fx.push({kind:'ring',x,y,r:0,m,life:.32,max:.32,col:c,w})}function burst(x,y,c,n=5){for(let i=0;i<n;i++)fx.push({kind:'p',x,y,vx:R(-105,105),vy:R(-105,105),life:R(.18,.38),max:.38,col:c})}
function heal(a){if(a<=0||P.dead)return;const before=P.hp;P.hp=Math.min(P.max,P.hp+a);const got=P.hp-before;if(got>=1)nums.push({x:P.x,y:P.y-30,t:'+'+(got|0),life:.55,col:'#6eff9b',big:false})}
function kill(e){if(e.dead)return;e.dead=true;kills++;heal(6);burst(e.x,e.y,e.col,9);ring(e.x,e.y,30,e.col,2)}
function hit(e,a,k,crit=false,kb=0){if(!e||e.dead)return;dmg[k]+=a;biggest=Math.max(biggest,a);e.hp-=a;nums.push({x:e.x,y:e.y-e.r-8,t:(a|0)+(crit?'!':''),life:.6,col:crit?'#ffd46a':'#fff',big:crit||a>150});burst(e.x,e.y,e.col,crit?8:4);if(k==='Slash'){arcs.push({x:P.x,y:P.y,a:P.facing,life:.13,max:.13,col:crit?'#ffe273':'#d9efff',w:crit?8:5});shake=Math.max(shake,crit?4:1.5);if(crit)freeze=Math.max(freeze,.04)}if(k==='Ground Slam'){freeze=Math.max(freeze,.07);shake=Math.max(shake,8)}if(k==='Whirlwind')shake=Math.max(shake,1.5);if(kb){const dx=e.x-P.x,dy=e.y-P.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*kb;e.y+=dy/l*kb}if(e.hp<=0)kill(e)}
function takeDamage(a,special=false){if(P.dead||P.dodge>0)return;const dealt=a*(special?.9:.8);P.hp-=dealt;taken+=dealt;nums.push({x:P.x,y:P.y-25,t:'-'+(dealt|0),life:.6,col:'#ff727b',big:true});burst(P.x,P.y,'#ff6372',5);shake=Math.max(shake,special?6:3);if(P.hp<=0){P.dead=true;active=false;finish(false)}}
function dodgeFrom(e){if(P.dodgeCd>0)return false;let dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1,vx=dx/l,vy=dy/l;if(e.type==='boss'&&e.mode==='charge'){const side=Math.random()<.5?-1:1;vx=-dy/l*side;vy=dx/l*side}P.x=cl(P.x+vx*82,22,W-22);P.y=cl(P.y+vy*82,38,H-28);P.dodge=.22;P.dodgeCd=1.1;dodges++;announce('DODGE','#7fe9ff');ring(P.x,P.y,30,'#6adfff',3);return true}
function upP(dt){P.hp=Math.min(P.max,P.hp+3*dt);P.atk=Math.max(0,P.atk-dt);P.ww=Math.max(0,P.ww-dt);P.slam=Math.max(0,P.slam-dt);P.dodge=Math.max(0,P.dodge-dt);P.dodgeCd=Math.max(0,P.dodgeCd-dt);if(P.dead)return;const threat=en.find(e=>!e.dead&&e.wind>0&&e.wind<.22&&dist(P,e)<(e.type==='boom'?76:e.type==='boss'?155:0));if(threat&&dodgeFrom(threat))return;if(P.wind>0){P.wind-=dt;if(P.wind<=0){announce('GROUND SLAM','#ffc056');ring(P.x,P.y,102,'#ffc056',7);for(const e of near(102))hit(e,175,'Ground Slam',false,30)}return}if(P.spin>0){P.spin-=dt;P.spinTick-=dt;const t=target();if(t){const dx=t.x-P.x,dy=t.y-P.y,l=Math.hypot(dx,dy)||1;P.facing=Math.atan2(dy,dx);P.x+=dx/l*P.spd*.7*dt;P.y+=dy/l*P.spd*.7*dt}if(P.spinTick<=0){P.spinTick=.25;for(const e of near(66))hit(e,30,'Whirlwind')}return}const t=target();if(!t)return;if(P.slam<=0&&near(102).length>=4){P.slam=7;P.wind=.55;announce('SLAM WINDUP','#ffc056');return}if(P.ww<=0&&near(66).length>=3){P.ww=5;P.spin=1.5;P.spinTick=0;announce('WHIRLWIND','#7edcff');return}const d=dist(P,t),dx=t.x-P.x,dy=t.y-P.y,l=Math.hypot(dx,dy)||1;P.facing=Math.atan2(dy,dx);if(d<=36&&P.atk<=0){P.atk=.8;const crit=Math.random()<.07;hit(t,R(35,45)*(crit?1.8:1),'Slash',crit,crit?14:6)}else{P.x+=dx/l*P.spd*dt;P.y+=dy/l*P.spd*dt}P.x=cl(P.x,18,W-18);P.y=cl(P.y,34,H-25)}
function segmentDistance(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,wx=px-x1,wy=py-y1,c1=wx*vx+wy*vy;if(c1<=0)return Math.hypot(px-x1,py-y1);const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-x2,py-y2);const b=c1/c2;return Math.hypot(px-(x1+b*vx),py-(y1+b*vy))}
function resolveBoss(e){if(e.mode==='cleave'){ring(e.x,e.y,95,'#ff653a',7);if(dist(P,e)<95)takeDamage(110,true)}else if(e.mode==='rupture'){ring(e.x,e.y,155,'#ff9d3d',7);if(dist(P,e)<155)takeDamage(86,true)}else if(e.mode==='charge'){const sx=e.x,sy=e.y,tx=e.chargeTarget?.x??P.x,ty=e.chargeTarget?.y??P.y,dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1,ex=cl(sx+dx/l*210,28,W-28),ey=cl(sy+dy/l*210,42,H-28);e.x=ex;e.y=ey;arcs.push({charge:true,x:sx,y:sy,x2:ex,y2:ey,life:.18,max:.18,col:'#ff4f3f',w:10});ring(ex,ey,60,'#ff4f3f',7);if(segmentDistance(P.x,P.y,sx,sy,ex,ey)<45)takeDamage(125,true)}e.mode='';e.chargeTarget=null;threatEl.textContent='Goal 01 v2.2 • combat feel'}
function upE(e,dt){if(e.dead||P.dead)return;e.atk=Math.max(0,e.atk-dt);e.special=Math.max(0,e.special-dt);let d=dist(e,P);if(e.type==='boom'){if(e.wind>0){e.wind-=dt;if(e.wind<=0){ring(e.x,e.y,76,'#ff3d25',7);if(d<76)takeDamage(e.dmg,true);e.dead=true;burst(e.x,e.y,'#ff4d2d',12)}return}if(d<e.range){e.wind=.82;return}}if(e.type==='necro'&&e.special<=0){e.special=4.7;if(en.filter(q=>!q.dead).length<29){spawn('rot',cl(e.x+R(-45,45),20,W-20),cl(e.y+R(-45,45),38,H-28));spawn('rot',cl(e.x+R(-45,45),20,W-20),cl(e.y+R(-45,45),38,H-28));announce('RAISE DEAD','#b887f2');ring(e.x,e.y,120,'#9b6fd3',2)}}if(e.type==='boss'){if(!e.enraged&&e.hp/e.max<=.3){e.enraged=true;e.spd*=1.25;e.period*=.75;announce('GOREMAW ENRAGED','#ff4b4b')}if(e.wind>0){e.wind-=dt;if(e.wind<=0)resolveBoss(e);return}if(e.special<=0){const r=Math.random();e.mode=r<.34?'cleave':r<.68?'rupture':'charge';e.wind=e.mode==='rupture'?.9:.72;e.special=R(2.9,4.2);if(e.mode==='charge')e.chargeTarget={x:P.x,y:P.y};threatEl.textContent='Goremaw: '+e.mode.toUpperCase();return}}if(e.type==='elite'){const k=Math.floor((1-e.hp/e.max)/.2),m=1+k*.09;e.spd=e.baseSpd*m;e.period=e.basePeriod/m;if(k>=3&&!e.enraged){e.enraged=true;announce('ELITE FRENZY','#ff9d35')}}const pref=(e.type==='archer'||e.type==='necro')?e.range*.78:0;if(pref){if(d>pref+15||d<pref-32){const dir=d>pref?1:-1,dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.spd*dt*dir;e.y+=dy/l*e.spd*dt*dir}}else if(d>e.range){const dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt}if(d<=e.range&&e.atk<=0){e.atk=e.period;if(e.type==='archer'||e.type==='necro')arcs.push({x:e.x,y:e.y,a:Math.atan2(P.y-e.y,P.x-e.x),life:.12,max:.12,col:e.col,w:3,enemy:true});takeDamage(e.dmg,false)}e.x=cl(e.x,16,W-16);e.y=cl(e.y,32,H-23)}
function finish(win){active=false;const sec=(performance.now()-start)/1000,total=Object.values(dmg).reduce((a,b)=>a+b,0),lines=[`Duration      ${sec.toFixed(1)}s`,`Damage dealt ${total|0}`,`Damage taken ${taken|0}`,`Kills        ${kills}`,`Threat dodges ${dodges}`,`Biggest hit  ${biggest|0}`,''];Object.entries(dmg).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>lines.push(`${k.padEnd(13)} ${total?(v/total*100).toFixed(1):0}%`));resultEl.textContent=win?'VICTORY':'DEFEAT';resultEl.className='result '+(win?'win':'loss');statsEl.textContent=lines.join('\n');goBtn.textContent=win?(wave===6?'REPLAY':'NEXT WAVE'):'RETRY';overlayEl.style.display='flex';nextBtn.disabled=false;announce(win?'ROOM CLEARED':'BUILD FAILED',win?'#ffd171':'#ff727b')}
function hud(){waveEl.textContent=`WAVE ${wave+1}/7 — ${waves[wave]?.[0]||''}`;hpEl.textContent=`HP ${Math.max(0,P.hp|0)}/500`;hpEl.classList.toggle('low',P.hp<150);spdEl.textContent=speed+'×';[[skillEls.Slash,P.atk],[skillEls.Whirlwind,P.ww],[skillEls.Slam,P.slam]].forEach(([el,cd])=>{el.classList.toggle('ready',cd<=0);el.querySelector('.cd').textContent=cd<=0?'READY':cd.toFixed(1)+'s'})}
function circ(o,r,c){X.beginPath();X.arc(o.x,o.y,r,0,6.283);X.fillStyle=c;X.fill();X.strokeStyle='#020509';X.lineWidth=2;X.stroke()}function drawEnemy(e){circ(e,e.r,e.col);X.fillStyle='#301014';X.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);X.fillStyle=e.type==='boss'?'#ff4b4f':'#55df6c';X.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.max),3);if(e.type==='boom'){X.fillStyle='#2a0808';X.font='900 15px system-ui';X.textAlign='center';X.fillText('!',e.x,e.y+5)}if(e.type==='elite'||e.type==='boss'){X.strokeStyle=e.type==='boss'?'#ff5a55':'#ff9d35';X.lineWidth=4;X.beginPath();X.arc(e.x,e.y,e.r+6,0,6.283);X.stroke()}if(e.wind>0){const rr=e.type==='boom'?76:e.mode==='cleave'?95:e.mode==='rupture'?155:e.mode==='charge'?65:45;X.strokeStyle=e.mode==='charge'?'#ff3440':'#ff843b';X.lineWidth=4;X.globalAlpha=.7+.25*Math.sin(performance.now()/70);X.beginPath();X.arc(e.x,e.y,rr,0,6.283);X.stroke();X.globalAlpha=1}}
function draw(){X.save();if(shake>0)X.translate(R(-shake,shake),R(-shake,shake));X.fillStyle='#0c131e';X.fillRect(-12,-12,W+24,H+24);X.strokeStyle='#172436';for(let gx=0;gx<W;gx+=48){X.beginPath();X.moveTo(gx,0);X.lineTo(gx,H);X.stroke()}for(let gy=0;gy<H;gy+=48){X.beginPath();X.moveTo(0,gy);X.lineTo(W,gy);X.stroke()}for(const f of fx){X.globalAlpha=Math.max(0,f.life/f.max);if(f.kind==='ring'){X.beginPath();X.arc(f.x,f.y,f.r,0,6.283);X.strokeStyle=f.col;X.lineWidth=f.w;X.stroke()}else{X.fillStyle=f.col;X.fillRect(f.x,f.y,3,3)}X.globalAlpha=1}for(const a of arcs){X.globalAlpha=Math.max(0,a.life/a.max);X.strokeStyle=a.col;X.lineWidth=a.w;X.beginPath();if(a.charge){X.moveTo(a.x,a.y);X.lineTo(a.x2,a.y2)}else X.arc(a.x,a.y,a.enemy?22:32,a.a-.7,a.a+.7);X.stroke();X.globalAlpha=1}for(const e of en)if(!e.dead)drawEnemy(e);circ(P,P.r,P.dodge>0?'#7ee9ff':'#469cff');X.strokeStyle='#d9efff';X.lineWidth=5;X.beginPath();X.moveTo(P.x+Math.cos(P.facing)*10,P.y+Math.sin(P.facing)*10);X.lineTo(P.x+Math.cos(P.facing)*30,P.y+Math.sin(P.facing)*30);X.stroke();if(P.spin>0){X.strokeStyle='#72d9ff';X.lineWidth=5;X.beginPath();X.arc(P.x,P.y,66,0,6.283);X.stroke()}if(P.wind>0){X.strokeStyle='#ffc055';X.lineWidth=6;X.beginPath();X.arc(P.x,P.y,102*(1-P.wind/.55),0,6.283);X.stroke()}for(const n of nums){X.globalAlpha=Math.max(0,n.life/.6);X.fillStyle=n.col;X.textAlign='center';X.font=`900 ${n.big?21:15}px system-ui`;X.fillText(n.t,n.x,n.y);X.globalAlpha=1}X.restore()}
function updateFx(dt){for(const f of fx){if(f.kind==='ring')f.r+=(f.m-f.r)*13*dt;else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96}f.life-=dt}fx=fx.filter(f=>f.life>0);for(const n of nums){n.y-=30*dt;n.life-=dt}nums=nums.filter(n=>n.life>0);for(const a of arcs)a.life-=dt;arcs=arcs.filter(a=>a.life>0)}
function loop(t){let dt=Math.min(.035,(t-last)/1000)*speed;last=t;if(freeze>0){freeze=Math.max(0,freeze-dt);dt=0}if(eventTimer>0){eventTimer-=.016;if(eventTimer<=0)eventEl.classList.remove('show')}if(active&&dt>0){upP(dt);for(const e of en)upE(e,dt);updateFx(dt);shake=Math.max(0,shake-20*dt);if(!P.dead&&!en.some(e=>!e.dead))finish(true);hud()}else if(dt>0){updateFx(dt);shake=Math.max(0,shake-20*dt)}draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(q=>q.classList.toggle('on',q===b));hud()});function nextWave(){if(active)return;begin(P.dead?wave:(wave===6?0:wave+1))}nextBtn.onclick=nextWave;goBtn.onclick=nextWave;window.addEventListener('error',e=>{threatEl.textContent='Runtime error: '+e.message;threatEl.style.color='#ff7b83'});setTimeout(()=>begin(0),80);requestAnimationFrame(loop);
</script></body></html>
