name: Goal 03 v1.2 Production Gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal3-production-v12.yml','goal3/deployment.md']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  URL: https://dopamine-playtest.vercel.app

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run public Vercel browser gates
        id: gate
        continue-on-error: true
        run: |
          set +e
          : >/tmp/prod-summary.txt
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME=$CHROME" | tee -a /tmp/prod-summary.txt
          [ -n "$CHROME" ] && "$CHROME" --version | tee -a /tmp/prod-summary.txt
          CORE=99; PROG=99; LOADOUT=99; MOBILE=99; SOAK=99

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$URL/?goal3test=1&seed=13371337&v=goal3-12" >/tmp/core.txt 2>/tmp/core.err
          grep -q 'GOAL3_TEST_OK=true' /tmp/core.txt && grep -q 'COMPONENT_SMOKE=true' /tmp/core.txt && grep -q 'ERRORS=</pre>' /tmp/core.txt; CORE=$?
          echo "PROD_CORE_EXIT=$CORE" | tee -a /tmp/prod-summary.txt; grep -o 'GOAL3_TEST_OK=[^<]*' /tmp/core.txt | tee -a /tmp/prod-summary.txt

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$URL/?goal3progressiontest=1&seed=13371337&v=goal3-12" >/tmp/prog.txt 2>/tmp/prog.err
          grep -q 'GOAL3_PROGRESSION_OK=true' /tmp/prog.txt && grep -q 'MONSTER_LEVEL_GATE=true' /tmp/prog.txt && grep -q 'DROP_UNLOCK=true' /tmp/prog.txt && grep -q 'LEVEL_SCALING=true' /tmp/prog.txt && grep -q 'ERRORS=</pre>' /tmp/prog.txt; PROG=$?
          echo "PROD_PROGRESSION_EXIT=$PROG" | tee -a /tmp/prod-summary.txt; grep -o 'GOAL3_PROGRESSION_OK=[^<]*' /tmp/prog.txt | tee -a /tmp/prod-summary.txt

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=18000 --dump-dom "$URL/?goal3loadoutuitest=1&seed=13371337&v=goal3-12" >/tmp/loadout.txt 2>/tmp/loadout.err
          grep -q 'GOAL3_LOADOUT_UI_OK=true' /tmp/loadout.txt && grep -q 'DOM_CLICK_EQUIPS=true' /tmp/loadout.txt && grep -q 'BRAIN_SELECTED_SYNC=true' /tmp/loadout.txt && grep -q 'NO_DUPLICATE_SLOTS=true' /tmp/loadout.txt && grep -q 'ERRORS=</pre>' /tmp/loadout.txt; LOADOUT=$?
          echo "PROD_LOADOUT_UI_EXIT=$LOADOUT" | tee -a /tmp/prod-summary.txt
          for K in GOAL3_LOADOUT_UI_OK DOM_CLICK_EQUIPS SELECTED_HIGHLIGHT THREE_PRIORITY_SLOTS BRAIN_OPTION_SYNC BRAIN_SELECTED_SYNC NO_DUPLICATE_SLOTS; do grep -o "$K=[^<]*" /tmp/loadout.txt | tee -a /tmp/prod-summary.txt; done

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=15000 --dump-dom "$URL/?goal3mobiletest=1&seed=13371337&v=goal3-12" >/tmp/mobile.txt 2>/tmp/mobile.err
          grep -q 'GOAL3_MOBILE_OK=true' /tmp/mobile.txt && grep -q 'NO_HORIZONTAL_OVERFLOW=true' /tmp/mobile.txt && grep -q 'TOUCH_TARGETS=true' /tmp/mobile.txt; MOBILE=$?
          echo "PROD_MOBILE_EXIT=$MOBILE" | tee -a /tmp/prod-summary.txt; grep -o 'GOAL3_MOBILE_OK=[^<]*' /tmp/mobile.txt | tee -a /tmp/prod-summary.txt

          timeout 100s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=80000 --dump-dom "$URL/?goal3skillsoak=1&seed=22994417&v=goal3-12" >/tmp/soak.txt 2>/tmp/soak.err
          grep -q 'GOAL3_SKILL_SOAK_OK=true' /tmp/soak.txt && grep -q 'SIM_SECONDS=3600' /tmp/soak.txt && grep -q 'STALLS=0' /tmp/soak.txt && grep -q 'ALL_SKILLS_UNLOCKED=true' /tmp/soak.txt && grep -q 'CAST_COVERAGE=true' /tmp/soak.txt && grep -q 'ERRORS=</pre>' /tmp/soak.txt; SOAK=$?
          echo "PROD_SKILL_SOAK_EXIT=$SOAK" | tee -a /tmp/prod-summary.txt
          for K in GOAL3_SKILL_SOAK_OK SIM_SECONDS STEPS ROOMS WINS LOSSES STALLS TRUNCATED_FINAL_ROOMS ALL_SKILLS_UNLOCKED CAST_COVERAGE PROGRESSION_DEPTH LOADOUT_COVERAGE DROPS UPGRADES MAX_SKILL_LEVEL CASTS STALL_INFO; do grep -o "$K=[^<]*" /tmp/soak.txt | tee -a /tmp/prod-summary.txt; done

          if [ "$CORE" -eq 0 ] && [ "$PROG" -eq 0 ] && [ "$LOADOUT" -eq 0 ] && [ "$MOBILE" -eq 0 ] && [ "$SOAK" -eq 0 ]; then echo 'PRODUCTION_FINAL_GATE=PASS' | tee -a /tmp/prod-summary.txt; exit 0; fi
          echo 'PRODUCTION_FINAL_GATE=FAIL' | tee -a /tmp/prod-summary.txt
          [ "$LOADOUT" -ne 0 ] && tail -c 4000 /tmp/loadout.txt | tee -a /tmp/prod-summary.txt
          [ "$SOAK" -ne 0 ] && tail -c 6000 /tmp/soak.txt | tee -a /tmp/prod-summary.txt
          exit 1

      - name: Publish production result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          { echo "### Goal 03 v1.2 public Vercel gate — ${OUTCOME^^}"; echo; echo '```text'; cat /tmp/prod-summary.txt 2>/dev/null || true; echo '```'; } >/tmp/report.md
          gh issue comment 4 --body-file /tmp/report.md
      - name: Enforce production gate
        if: steps.gate.outcome != 'success'
        run: exit 1
