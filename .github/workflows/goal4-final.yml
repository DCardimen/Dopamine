name: Goal 04 Final 9-of-10 Gate

on:
  push:
    branches: [main]
    paths: ['goal4/**','goal3/drop-corner-fix.js','.github/workflows/goal4-final.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Goal 04 final verification
        id: gate
        continue-on-error: true
        run: |
          set +e; : >/tmp/g4final.txt
          FILES='goal3/drop-corner-fix.js goal4/catalog.js goal4/runtime.js goal4/fun-pass.js goal4/gap-pass.js goal4/gap-stability.js goal4/final-polish.js goal4/quality-final-v2.js'; SYNTAX=0
          for F in $FILES; do node --check "$F" || SYNTAX=1; done
          echo "SYNTAX_EXIT=$SYNTAX" | tee -a /tmp/g4final.txt
          python3 - <<'PY'
          from pathlib import Path
          src=Path('playtest/index.html').read_text()
          g3=['legacy-compat.js','skills.js','runtime-fixes.js','progression.js','brain-sync.js','polish.js','signoff.js','signoff-fixes.js','drop-corner-fix.js']
          g4=['catalog.js','runtime.js','fun-pass.js','gap-pass.js','gap-stability.js','final-polish.js','quality-final-v2.js']
          scripts=''.join(f'<script src="/goal3/{f}?v=4final3"></script>' for f in g3)+''.join(f'<script src="/goal4/{f}?v=4final3"></script>' for f in g4)
          Path('playtest/goal4-final-v2.html').write_text(src.replace('</body>',scripts+'</body>'))
          PY
          HARNESS=$?; echo "HARNESS_EXIT=$HARNESS" | tee -a /tmp/g4final.txt
          C="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"; echo "CHROME=$C" | tee -a /tmp/g4final.txt; [ -n "$C" ] && "$C" --version | tee -a /tmp/g4final.txt
          python3 -m http.server 4173 >/tmp/http.log 2>&1 & HP=$!; sleep 1
          UI=99; MATRIX=99; PROG=99; HOUR=99; G2=99; G3=99
          if [ "$SYNTAX" -eq 0 ] && [ "$HARNESS" -eq 0 ] && [ -n "$C" ]; then
            timeout 75s "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=45000 --dump-dom 'http://127.0.0.1:4173/playtest/goal4-final-v2.html?goal4finalui=1&seed=22994417' >/tmp/ui 2>/tmp/e
            grep -q 'GOAL4_FINAL_UI_OK=true' /tmp/ui && grep -q 'ARSENAL_CARDS=30' /tmp/ui && grep -q 'LOOT_BOTTOM_RIGHT=true' /tmp/ui && grep -q 'COMPARE_POPUP_BOTTOM_RIGHT=true' /tmp/ui && grep -q 'COMPARE_DELTA_COLUMNS=3' /tmp/ui && grep -q 'VISUAL_ACTIVE=true' /tmp/ui && grep -q 'ERRORS=</pre>' /tmp/ui; UI=$?
            echo "FINAL_UI_EXIT=$UI" | tee -a /tmp/g4final.txt
            for K in GOAL4_FINAL_UI_OK ARSENAL_CARDS CATALOG ROLE_COVERAGE FUN_IMPROVEMENTS GAP_IMPROVEMENTS LOOT_BOTTOM_RIGHT COMPARE_POPUP_BOTTOM_RIGHT COMPARE_DELTA_COLUMNS LOOT_FONT_PX COMPARE_FONT_PX VISUAL_FAMILIES VISUAL_ACTIVE SMART_PRESETS SEARCH_FAVORITES_BUILD_LIBRARY SAVE_BACKUP_SMART_DISCOVERY PROGRESSION_SHAPE EXCEPTION ERRORS; do grep -o "$K=[^<]*" /tmp/ui | head -1 | tee -a /tmp/g4final.txt; done

            timeout 180s "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=160000 --dump-dom 'http://127.0.0.1:4173/playtest/goal4-final-v2.html?goal4finalmatrix=1&seed=22994417' >/tmp/matrix 2>/tmp/e
            grep -q 'GOAL4_FINAL_MATRIX_OK=true' /tmp/matrix && grep -q 'MATRIX_ROOMS=300' /tmp/matrix && grep -q 'STALLS=0' /tmp/matrix && grep -q 'CAST_COVERAGE=true' /tmp/matrix && grep -q 'ERRORS=</pre>' /tmp/matrix; MATRIX=$?
            echo "FINAL_MATRIX_EXIT=$MATRIX" | tee -a /tmp/g4final.txt
            for K in GOAL4_FINAL_MATRIX_OK MATRIX_ROOMS MATRIX_STEPS STALLS MIN_WIN_RATE MAX_WIN_RATE CAST_COVERAGE ERRORS; do grep -o "$K=[^<]*" /tmp/matrix | head -1 | tee -a /tmp/g4final.txt; done
            grep -Eo 'BUILD[0-9]+=[^<]*' /tmp/matrix | tee -a /tmp/g4final.txt

            timeout 120s "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=110000 --dump-dom 'http://127.0.0.1:4173/playtest/goal4-final-v2.html?goal4finalprogressionv2=1&seed=4477331' >/tmp/prog 2>/tmp/e
            grep -q 'GOAL4_FINAL_PROGRESSION_V2_OK=true' /tmp/prog && grep -q 'DISCOVERED=30/30' /tmp/prog && grep -q 'STALLS=0' /tmp/prog && grep -q 'ERRORS=</pre>' /tmp/prog; PROG=$?
            echo "FINAL_PROGRESSION_EXIT=$PROG" | tee -a /tmp/g4final.txt
            for K in GOAL4_FINAL_PROGRESSION_V2_OK DISCOVERED SIM_SECONDS STEPS ROOMS MAX_DEPTH ALL_UNLOCK_SECONDS STALLS ERRORS; do grep -o "$K=[^<]*" /tmp/prog | head -1 | tee -a /tmp/g4final.txt; done

            timeout 180s "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=150000 --dump-dom 'http://127.0.0.1:4173/playtest/goal4-final-v2.html?goal4finalhour=1&seed=38118421' >/tmp/hour 2>/tmp/e
            grep -q 'GOAL4_FINAL_HOUR_OK=true' /tmp/hour && grep -q 'SIM_SECONDS=3600' /tmp/hour && grep -q 'STALLS=0' /tmp/hour && grep -q 'CAST_COVERAGE=true' /tmp/hour && grep -q 'ERRORS=</pre>' /tmp/hour; HOUR=$?
            echo "FINAL_1H_EXIT=$HOUR" | tee -a /tmp/g4final.txt
            for K in GOAL4_FINAL_HOUR_OK SIM_SECONDS STEPS ROOMS WINS LOSSES STALLS TRUNCATED_FINAL_ROOMS CAST_COVERAGE CASTS STALL_INFO ERRORS; do grep -o "$K=[^<]*" /tmp/hour | head -1 | tee -a /tmp/g4final.txt; done

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:4173/playtest/index.html?selftest=1&seed=13699422' >/tmp/g2 2>/tmp/e
            grep -q 'SELFTEST_OK=true' /tmp/g2 && grep -q 'ERRORS=</pre>' /tmp/g2; G2=$?; echo "GOAL2_REGRESSION_EXIT=$G2" | tee -a /tmp/g4final.txt
            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:4173/playtest/goal4-final-v2.html?goal3test=1&seed=13371337' >/tmp/g3 2>/tmp/e
            grep -q 'GOAL3_TEST_OK=true' /tmp/g3 && grep -q 'ERRORS=</pre>' /tmp/g3; G3=$?; echo "GOAL3_REGRESSION_EXIT=$G3" | tee -a /tmp/g4final.txt
          fi
          kill "$HP" 2>/dev/null || true
          if [ "$UI" -eq 0 ] && [ "$MATRIX" -eq 0 ] && [ "$PROG" -eq 0 ] && [ "$HOUR" -eq 0 ] && [ "$G2" -eq 0 ] && [ "$G3" -eq 0 ]; then
            echo 'COMPLETENESS_SCORE=10.0/10' | tee -a /tmp/g4final.txt
            echo 'GOAL4_LOCAL_FINAL=PASS' | tee -a /tmp/g4final.txt
            exit 0
          fi
          echo 'GOAL4_LOCAL_FINAL=FAIL' | tee -a /tmp/g4final.txt
          for F in ui matrix prog hour; do echo "--- $F tail ---" | tee -a /tmp/g4final.txt; tail -c 9000 "/tmp/$F" 2>/dev/null | tee -a /tmp/g4final.txt; done
          exit 1
      - name: Publish final local report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          { echo "### Goal 04 Phase 6 — isolated final 9/10 gate ${OUTCOME^^}"; echo; echo "Commit: \`${GITHUB_SHA}\`"; echo; echo '```text'; cat /tmp/g4final.txt 2>/dev/null || true; echo '```'; } >/tmp/report.md
          gh issue comment 5 --body-file /tmp/report.md
      - name: Enforce
        if: steps.gate.outcome != 'success'
        run: exit 1
