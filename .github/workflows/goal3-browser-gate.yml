name: Goal 03 Browser Gate

on:
  push:
    branches: [main]
    paths: ['goal3/**','playtest/**','.github/workflows/goal3-browser-gate.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PROD: https://dopamine-playtest.vercel.app

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run local and public Goal 03 v1.2 gates
        id: gate
        continue-on-error: true
        run: |
          set +e; : >/tmp/gate.txt
          FILES='legacy-compat.js skills.js runtime-fixes.js progression.js brain-sync.js polish.js progression-quality.js quality-v2.js'; SYNTAX=0
          for F in $FILES; do node --check "goal3/$F" || SYNTAX=1; done
          echo "SYNTAX_EXIT=$SYNTAX" | tee -a /tmp/gate.txt
          python3 - <<'PY'
          from pathlib import Path
          src=Path('playtest/index.html').read_text()
          fs=['legacy-compat.js','skills.js','runtime-fixes.js','progression.js','brain-sync.js','polish.js','progression-quality.js','quality-v2.js']
          Path('playtest/goal3-test.html').write_text(src.replace('</body>',''.join(f'<script src="/goal3/{f}?v=12"></script>' for f in fs)+'</body>'))
          PY
          HARNESS=$?; echo "HARNESS_EXIT=$HARNESS" | tee -a /tmp/gate.txt
          C="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"; echo "CHROME=$C" | tee -a /tmp/gate.txt; [ -n "$C" ] && "$C" --version | tee -a /tmp/gate.txt
          python3 -m http.server 4173 >/tmp/http.log 2>&1 & HP=$!; sleep 1; curl -fsS http://127.0.0.1:4173/playtest/goal3-test.html >/dev/null; SERVER=$?; echo "SERVER_EXIT=$SERVER" | tee -a /tmp/gate.txt
          CORE=99; PROG=99; LOAD=99; MOBILE=99; SOAK=99; G2=99; PCORE=99; PLOAD=99; PSOAK=99
          if [ "$SYNTAX" -eq 0 ] && [ "$HARNESS" -eq 0 ] && [ "$SERVER" -eq 0 ] && [ -n "$C" ]; then
            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:4173/playtest/goal3-test.html?goal3test=1&seed=13371337' >/tmp/core 2>/tmp/e
            grep -q 'GOAL3_TEST_OK=true' /tmp/core && grep -q 'COMPONENT_SMOKE=true' /tmp/core && grep -q 'ERRORS=</pre>' /tmp/core; CORE=$?; echo "LOCAL_CORE_EXIT=$CORE" | tee -a /tmp/gate.txt

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:4173/playtest/goal3-test.html?goal3progressiontest=1&seed=13371337' >/tmp/prog 2>/tmp/e
            grep -q 'GOAL3_PROGRESSION_OK=true' /tmp/prog && grep -q 'MONSTER_LEVEL_GATE=true' /tmp/prog && grep -q 'DROP_UNLOCK=true' /tmp/prog && grep -q 'LEVEL_SCALING=true' /tmp/prog && grep -q 'ERRORS=</pre>' /tmp/prog; PROG=$?; echo "LOCAL_PROGRESSION_EXIT=$PROG" | tee -a /tmp/gate.txt

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:4173/playtest/goal3-test.html?goal3loadoutuitest=1&seed=13371337' >/tmp/load 2>/tmp/e
            grep -q 'GOAL3_LOADOUT_UI_OK=true' /tmp/load && grep -q 'DOM_CLICK_EQUIPS=true' /tmp/load && grep -q 'BRAIN_SELECTED_SYNC=true' /tmp/load && grep -q 'NO_DUPLICATE_SLOTS=true' /tmp/load; LOAD=$?; echo "LOCAL_LOADOUT_EXIT=$LOAD" | tee -a /tmp/gate.txt

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:4173/playtest/goal3-test.html?goal3mobiletest=1&seed=13371337' >/tmp/mobile 2>/tmp/e
            grep -q 'GOAL3_MOBILE_OK=true' /tmp/mobile && grep -q 'NO_HORIZONTAL_OVERFLOW=true' /tmp/mobile && grep -q 'TOUCH_TARGETS=true' /tmp/mobile; MOBILE=$?; echo "LOCAL_MOBILE_EXIT=$MOBILE" | tee -a /tmp/gate.txt

            timeout 90s "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=75000 --dump-dom 'http://127.0.0.1:4173/playtest/goal3-test.html?goal3skillsoak=1&seed=22994417' >/tmp/soak 2>/tmp/e
            grep -q 'GOAL3_SKILL_SOAK_OK=true' /tmp/soak && grep -q 'SIM_SECONDS=3600' /tmp/soak && grep -q 'STALLS=0' /tmp/soak && grep -q 'ALL_SKILLS_UNLOCKED=true' /tmp/soak && grep -q 'CAST_COVERAGE=true' /tmp/soak && grep -q 'ERRORS=</pre>' /tmp/soak; SOAK=$?; echo "LOCAL_1H_SOAK_EXIT=$SOAK" | tee -a /tmp/gate.txt
            for K in SIM_SECONDS STEPS WINS LOSSES STALLS TRUNCATED_FINAL_ROOMS DROPS UPGRADES MAX_SKILL_LEVEL CASTS STALL_INFO; do grep -o "$K=[^<]*" /tmp/soak | head -1 | tee -a /tmp/gate.txt; done

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:4173/playtest/index.html?selftest=1&seed=13699422' >/tmp/g2 2>/tmp/e
            grep -q 'SELFTEST_OK=true' /tmp/g2 && grep -q 'ERRORS=</pre>' /tmp/g2; G2=$?; echo "GOAL2_REGRESSION_EXIT=$G2" | tee -a /tmp/gate.txt

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$PROD/?goal3test=1&seed=13371337&v=goal3-12" >/tmp/pcore 2>/tmp/pe
            grep -q 'GOAL3_TEST_OK=true' /tmp/pcore && grep -q 'ERRORS=</pre>' /tmp/pcore; PCORE=$?; echo "PUBLIC_CORE_EXIT=$PCORE" | tee -a /tmp/gate.txt

            "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=18000 --dump-dom "$PROD/?goal3loadoutuitest=1&seed=13371337&v=goal3-12" >/tmp/pload 2>/tmp/pe
            grep -q 'GOAL3_LOADOUT_UI_OK=true' /tmp/pload && grep -q 'DOM_CLICK_EQUIPS=true' /tmp/pload && grep -q 'BRAIN_SELECTED_SYNC=true' /tmp/pload && grep -q 'NO_DUPLICATE_SLOTS=true' /tmp/pload; PLOAD=$?; echo "PUBLIC_LOADOUT_EXIT=$PLOAD" | tee -a /tmp/gate.txt

            timeout 100s "$C" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=80000 --dump-dom "$PROD/?goal3skillsoak=1&seed=22994417&v=goal3-12" >/tmp/psoak 2>/tmp/pe
            grep -q 'GOAL3_SKILL_SOAK_OK=true' /tmp/psoak && grep -q 'SIM_SECONDS=3600' /tmp/psoak && grep -q 'STALLS=0' /tmp/psoak && grep -q 'ALL_SKILLS_UNLOCKED=true' /tmp/psoak && grep -q 'CAST_COVERAGE=true' /tmp/psoak && grep -q 'ERRORS=</pre>' /tmp/psoak; PSOAK=$?; echo "PUBLIC_1H_SOAK_EXIT=$PSOAK" | tee -a /tmp/gate.txt
            for K in SIM_SECONDS STEPS WINS LOSSES STALLS TRUNCATED_FINAL_ROOMS DROPS UPGRADES MAX_SKILL_LEVEL CASTS STALL_INFO; do grep -o "$K=[^<]*" /tmp/psoak | head -1 | sed 's/^/PUBLIC_/' | tee -a /tmp/gate.txt; done
          fi
          kill "$HP" 2>/dev/null || true
          if [ "$CORE" -eq 0 ] && [ "$PROG" -eq 0 ] && [ "$LOAD" -eq 0 ] && [ "$MOBILE" -eq 0 ] && [ "$SOAK" -eq 0 ] && [ "$G2" -eq 0 ] && [ "$PCORE" -eq 0 ] && [ "$PLOAD" -eq 0 ] && [ "$PSOAK" -eq 0 ]; then echo 'FINAL_GATE=PASS' | tee -a /tmp/gate.txt; exit 0; fi
          echo 'FINAL_GATE=FAIL' | tee -a /tmp/gate.txt; [ "$PLOAD" -ne 0 ] && tail -c 5000 /tmp/pload | tee -a /tmp/gate.txt; [ "$PSOAK" -ne 0 ] && tail -c 6000 /tmp/psoak | tee -a /tmp/gate.txt; exit 1
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          { echo "### Goal 03 v1.2 local + public Vercel gate — ${OUTCOME^^}"; echo; echo "Commit: \`${GITHUB_SHA}\`"; echo; echo '```text'; cat /tmp/gate.txt 2>/dev/null || true; echo '```'; } >/tmp/report.md
          gh issue comment 4 --body-file /tmp/report.md
      - name: Enforce gate
        if: steps.gate.outcome != 'success'
        run: exit 1
