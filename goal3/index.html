<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dopamine — Goal 03 Skill Progression</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d}
iframe{border:0;width:100%;height:100%;display:block;background:#05080d}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#05080d;color:#eef4ff;font:800 14px system-ui;letter-spacing:.04em;z-index:2}
</style>
</head>
<body>
<div id="boot">LOADING GOAL 03 v1.2…</div>
<iframe id="game" title="Dopamine Goal 03 playtest"></iframe>
<script>
const frame=document.getElementById('game');
frame.src='../playtest/index.html'+location.search;
frame.addEventListener('load',async()=>{
  const doc=frame.contentDocument;
  const files=['legacy-compat.js','skills.js','runtime-fixes.js','progression.js','brain-sync.js','polish.js','progression-quality.js','quality-v2.js'];
  try{
    for(const file of files)await new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src='/goal3/'+file+'?v=12';s.onload=resolve;s.onerror=reject;doc.body.appendChild(s)});
    document.getElementById('boot').remove();
  }catch(e){document.getElementById('boot').textContent='GOAL 03 PATCH FAILED TO LOAD';}
});
</script>
</body>
</html>
